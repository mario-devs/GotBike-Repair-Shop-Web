<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Spoke Bikes - Demo</title>

    <style>
/* ===========================
   DESIGN SYSTEM — Black Spoke Bikes
   Black & White palette, Inter + Syne fonts
   =========================== */

:root {
  /* colors */
  --black: #000000;
  --white: #ffffff;
  --primary: #FACC15;
  --gray-50: #fafafa;
  --gray-100: #f5f5f5;
  --gray-200: #e5e5e5;
  --gray-300: #d4d4d4;
  --gray-400: #a3a3a3;
  --gray-500: #737373;
  --gray-600: #525252;
  --gray-700: #404040;
  --gray-800: #262626;
  --gray-900: #171717;

  /* typography */
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-display: 'Syne', 'Inter', sans-serif;

  /* spacing */
  --space-xs: 0.25rem;
  --space-sm: 0.5rem;
  --space-md: 1rem;
  --space-lg: 2rem;
  --space-xl: 3rem;
  --space-2xl: 5rem;
  --space-3xl: 8rem;

  /* layout */
  --max-width: 1200px;
  --nav-height: 72px;

  /* transitions */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --duration-fast: 0.2s;
  --duration-normal: 0.4s;
  --duration-slow: 0.7s;
}

/* reset */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  color: var(--black);
  background-color: var(--white);
  overflow-x: hidden;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-display);
  font-weight: 700;
  line-height: 1.1;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  max-width: 100%;
  display: block;
}

button {
  font-family: var(--font-body);
  cursor: pointer;
  border: none;
  background: none;
}

input, select, textarea {
  font-family: var(--font-body);
  font-size: 1rem;
}

ul {
  list-style: none;
}

/* utility: container */
.container {
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 var(--space-lg);
}

/* utility: section padding */
.section {
  padding: var(--space-3xl) 0;
}

/* utility: section title */
.section-title {
  font-size: clamp(2rem, 5vw, 3.5rem);
  margin-bottom: var(--space-md);
}

.section-subtitle {
  font-size: 1.125rem;
  color: var(--gray-500);
  max-width: 560px;
  font-weight: 400;
}

/* scrollbar styling */
::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: var(--gray-100);
}

::-webkit-scrollbar-thumb {
  background: var(--gray-400);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--gray-600);
}

.app {
  overflow-x: hidden;
}

.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  height: var(--nav-height);
  display: flex;
  align-items: center;
  transition: background var(--duration-normal) var(--ease-out),
              backdrop-filter var(--duration-normal) var(--ease-out);
}

.navbar.scrolled {
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.navbar .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.navbar-logo {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--white);
  letter-spacing: -0.5px;
  text-transform: uppercase;
}

.navbar-logo span {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: var(--white);
  border-radius: 50%;
  margin-left: 4px;
  vertical-align: middle;
}

.navbar-links {
  display: flex;
  gap: var(--space-lg);
}

.navbar-links a {
  color: var(--gray-300);
  font-size: 0.875rem;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: color var(--duration-fast) var(--ease-out);
  position: relative;
}

.navbar-links a::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  width: 0;
  height: 1.5px;
  background: var(--white);
  transition: width var(--duration-normal) var(--ease-out);
}

.navbar-links a:hover {
  color: var(--white);
}

.navbar-links a:hover::after {
  width: 100%;
}

.navbar-menu-btn {
  display: none;
  color: var(--white);
}

/* mobile */
@media (max-width: 768px) {
  .navbar-links {
    display: none;
  }
  .navbar-menu-btn {
    display: block;
  }
  .navbar-links.open {
    display: flex;
    flex-direction: column;
    position: absolute;
    top: var(--nav-height);
    left: 0;
    right: 0;
    background: rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(12px);
    padding: var(--space-lg);
    gap: var(--space-md);
  }
}

.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--black);
  color: var(--white);
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -30%;
  width: 80vw;
  height: 80vw;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.06);
  pointer-events: none;
}

.hero::after {
  content: '';
  position: absolute;
  bottom: -40%;
  left: -20%;
  width: 60vw;
  height: 60vw;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.04);
  pointer-events: none;
}

.hero-content {
  text-align: center;
  max-width: 900px;
  padding: 0 var(--space-lg);
  position: relative;
  z-index: 1;
}

.hero-tag {
  display: inline-block;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--black);
  background-color: var(--primary);
  margin-bottom: var(--space-lg);
  border: 1px solid var(--primary);
  padding: var(--space-xs) var(--space-md);
  border-radius: 100px;
}

.hero h1 {
  font-size: clamp(2.8rem, 8vw, 6.5rem);
  font-weight: 800;
  letter-spacing: -2px;
  line-height: 1;
  margin-bottom: var(--space-lg);
}

.hero-description {
  font-size: clamp(1rem, 2vw, 1.25rem);
  color: var(--gray-400);
  max-width: 520px;
  margin: 0 auto var(--space-xl);
  line-height: 1.7;
}

.hero-cta {
  display: inline-flex;
  align-items: center;
  gap: var(--space-sm);
  background: var(--primary);
  color: var(--black);
  font-size: 1rem;
  font-weight: 600;
  padding: var(--space-md) var(--space-xl);
  border-radius: 100px;
  transition: transform var(--duration-normal) var(--ease-out),
              box-shadow var(--duration-normal) var(--ease-out);
}

.hero-cta:hover {
  transform: scale(1.05);
  box-shadow: 0 0 40px rgba(250, 204, 21, 0.25);
}

.hero-scroll-indicator {
  position: absolute;
  bottom: var(--space-xl);
  left: 50%;
  transform: translateX(-50%);
}

.hero-scroll-line {
  width: 1px;
  height: 48px;
  background: linear-gradient(to bottom, var(--gray-500), transparent);
}

.services {
  background: var(--white);
}

.services-header {
  text-align: center;
  margin-bottom: var(--space-2xl);
}

.services-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-lg);
}

.service-card {
  border: 1px solid var(--gray-200);
  border-radius: 16px;
  padding: var(--space-xl);
  transition: border-color var(--duration-normal) var(--ease-out),
              box-shadow var(--duration-normal) var(--ease-out);
  position: relative;
  overflow: hidden;
}

.service-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--primary);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform var(--duration-normal) var(--ease-out);
}

.service-card:hover {
  border-color: var(--primary);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
}

.service-card:hover::before {
  transform: scaleX(1);
}

.service-icon {
  width: 48px;
  height: 48px;
  background: var(--gray-100);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: var(--space-md);
  transition: background var(--duration-fast) var(--ease-out),
              color var(--duration-fast) var(--ease-out);
}

.service-card:hover .service-icon {
  background: var(--primary);
  color: var(--black);
}

.service-card h3 {
  font-family: var(--font-display);
  font-size: 1.25rem;
  margin-bottom: var(--space-sm);
}

.service-card p {
  color: var(--gray-500);
  font-size: 0.95rem;
  line-height: 1.6;
  margin-bottom: var(--space-md);
}

.service-price {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.1rem;
}

@media (max-width: 768px) {
  .services-grid {
    grid-template-columns: 1fr;
  }
}

.how-it-works {
  background: var(--gray-50);
}

.how-it-works-header {
  text-align: center;
  margin-bottom: var(--space-2xl);
}

.steps-row {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 0;
}

.step {
  flex: 1;
  max-width: 300px;
  text-align: center;
  padding: 0 var(--space-lg);
  position: relative;
}

.step-number {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--primary);
  color: var(--black);
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto var(--space-md);
}

.step-connector {
  position: absolute;
  top: 32px;
  left: calc(50% + 40px);
  width: calc(100% - 80px);
  height: 1px;
  background: var(--gray-300);
}

.step:last-child .step-connector {
  display: none;
}

.step h3 {
  font-size: 1.15rem;
  margin-bottom: var(--space-sm);
}

.step p {
  color: var(--gray-500);
  font-size: 0.95rem;
  line-height: 1.6;
}

@media (max-width: 768px) {
  .steps-row {
    flex-direction: column;
    align-items: center;
    gap: var(--space-xl);
  }
  .step-connector {
    display: none;
  }
}

.about {
  background: var(--black);
  color: var(--white);
}

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-2xl);
  align-items: center;
}

.about-text .section-subtitle {
  color: var(--gray-400);
}

.about-text p {
  color: var(--gray-400);
  font-size: 1rem;
  line-height: 1.8;
  margin-top: var(--space-md);
}

.about-stats {
  display: flex;
  gap: var(--space-xl);
  margin-top: var(--space-xl);
}

.stat-item {
  text-align: left;
}

.stat-number {
  font-family: var(--font-display);
  font-size: 2.5rem;
  font-weight: 800;
  line-height: 1;
  margin-bottom: var(--space-xs);
  color: var(--primary);
}

.stat-label {
  font-size: 0.85rem;
  color: var(--gray-500);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.about-image {
  position: relative;
  aspect-ratio: 4/5;
  border-radius: 16px;
  overflow: hidden;
  background: var(--gray-800);
  display: flex;
  align-items: center;
  justify-content: center;
}

.about-image-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-md);
  color: var(--gray-600);
}

.about-image-inner svg {
  opacity: 0.3;
}

.about-image-border {
  position: absolute;
  inset: -1px;
  border-radius: 16px;
  border: 1px solid var(--gray-700);
  pointer-events: none;
}

@media (max-width: 768px) {
  .about-grid {
    grid-template-columns: 1fr;
    gap: var(--space-xl);
  }
  .about-stats {
    gap: var(--space-lg);
  }
  .stat-number {
    font-size: 2rem;
  }
}

.testimonials {
  background: var(--white);
  overflow: hidden;
}

.testimonials-header {
  text-align: center;
  margin-bottom: var(--space-2xl);
}

.testimonials-track {
  display: flex;
  gap: var(--space-lg);
  cursor: grab;
  padding-bottom: var(--space-md);
}

.testimonials-track:active {
  cursor: grabbing;
}

.testimonial-card {
  min-width: 340px;
  max-width: 400px;
  border: 1px solid var(--gray-200);
  border-radius: 16px;
  padding: var(--space-xl);
  flex-shrink: 0;
  user-select: none;
}

.testimonial-stars {
  display: flex;
  gap: 2px;
  margin-bottom: var(--space-md);
  color: var(--primary);
}

.testimonial-card blockquote {
  font-size: 1rem;
  line-height: 1.7;
  color: var(--gray-600);
  margin-bottom: var(--space-md);
  font-style: italic;
}

.testimonial-author {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}

.testimonial-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--gray-200);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.9rem;
}

.testimonial-name {
  font-weight: 600;
  font-size: 0.95rem;
}

.testimonial-role {
  font-size: 0.8rem;
  color: var(--gray-500);
}

@media (max-width: 768px) {
  .testimonial-card {
    min-width: 280px;
  }
}

.book-repair {
  background: var(--gray-50);
}

.book-repair-header {
  text-align: center;
  margin-bottom: var(--space-2xl);
}

.book-form {
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-md);
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
}

.form-group label {
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--gray-600);
}

.form-group input,
.form-group select,
.form-group textarea {
  padding: 14px 16px;
  border: 1px solid var(--gray-300);
  border-radius: 10px;
  background: var(--white);
  font-size: 1rem;
  color: var(--black);
  transition: border-color var(--duration-fast) var(--ease-out),
              box-shadow var(--duration-fast) var(--ease-out);
  outline: none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.25);
}

.form-group textarea {
  resize: vertical;
  min-height: 100px;
}

.form-group input::placeholder,
.form-group textarea::placeholder {
  color: var(--gray-400);
}

.submit-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  background: var(--primary);
  color: var(--black);
  font-size: 1rem;
  font-weight: 600;
  padding: 16px 32px;
  border-radius: 100px;
  border: none;
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-out),
              box-shadow var(--duration-normal) var(--ease-out);
  margin-top: var(--space-sm);
  width: 100%;
}

.submit-btn:hover {
  transform: scale(1.02);
  box-shadow: 0 4px 20px rgba(250, 204, 21, 0.3);
}

.submit-btn:active {

}

.submit-btn.success {
  background: var(--gray-800);
  color: var(--white);

}

.success-message {
  text-align: center;
  padding: var(--space-xl);
}

.success-message h3 {
  font-size: 1.5rem;
  margin-bottom: var(--space-sm);
}

.success-message p {
  color: var(--gray-500);
}

@media (max-width: 768px) {
  .form-row {
    grid-template-columns: 1fr;
  }
}

.footer {
  background: var(--black);
  color: var(--gray-400);
  padding: var(--space-2xl) 0 var(--space-lg);
}

.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: var(--space-xl);
  margin-bottom: var(--space-2xl);
}

.footer-brand .navbar-logo {
  font-size: 1.2rem;
  margin-bottom: var(--space-md);
  display: inline-block;
}

.footer-brand p {
  font-size: 0.9rem;
  line-height: 1.7;
  max-width: 280px;
}

.footer-col h4 {
  font-family: var(--font-display);
  color: var(--white);
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: var(--space-md);
}

.footer-col ul {
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
}

.footer-col a {
  font-size: 0.9rem;
  color: var(--gray-500);
  transition: color var(--duration-fast);
}

.footer-col a:hover {
  color: var(--white);
}

.footer-col .hours-line {
  font-size: 0.9rem;
  display: flex;
  justify-content: space-between;
  max-width: 200px;
}

.footer-col .hours-line span:last-child {
  color: var(--gray-500);
}

.footer-bottom {
  border-top: 1px solid var(--gray-800);
  padding-top: var(--space-lg);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.8rem;
}

.footer-bottom-links {
  display: flex;
  gap: var(--space-md);
}

.footer-bottom-links a {
  color: var(--gray-600);
  transition: color var(--duration-fast);
}

.footer-bottom-links a:hover {
  color: var(--white);
}

@media (max-width: 768px) {
  .footer-grid {
    grid-template-columns: 1fr 1fr;
    gap: var(--space-lg);
  }
  .footer-bottom {
    flex-direction: column;
    gap: var(--space-sm);
    text-align: center;
  }
}

<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module">

import React, { useState, useEffect } from 'react';
import { createRoot } from 'react-dom/client';
import { motion, AnimatePresence } from 'framer-motion';
import { Menu, X, ArrowRight, Wrench, CircleDot, Settings, Zap, ShieldCheck, Bike, Star, MapPin, Phone, Mail, Send, CheckCircle } from 'lucide-react';


const links = [
  { label: 'Services', href: '#services' },
  { label: 'How It Works', href: '#how-it-works' },
  { label: 'About', href: '#about' },
  { label: 'Reviews', href: '#testimonials' },
  { label: 'Book Repair', href: '#book' },
]

function Navbar() {
  const [scrolled, setScrolled] = useState(false)
  const [menuOpen, setMenuOpen] = useState(false)

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 50)
    window.addEventListener('scroll', onScroll)
    return () => window.removeEventListener('scroll', onScroll)
  }, [])

  return (
    <motion.nav
      className={`navbar ${scrolled ? 'scrolled' : ''}`}
      initial={{ y: -80 }}
      animate={{ y: 0 }}
      transition={{ duration: 0.6, ease: [0.16, 1, 0.3, 1] }}
    >
      <div className="container">
        <a href="#" className="navbar-logo">
          Black Spoke<span></span>
        </a>
        <div className={`navbar-links ${menuOpen ? 'open' : ''}`}>
          {links.map((link) => (
            <a
              key={link.href}
              href={link.href}
              onClick={() => setMenuOpen(false)}
            >
              {link.label}
            </a>
          ))}
        </div>
        <button
          className="navbar-menu-btn"
          onClick={() => setMenuOpen(!menuOpen)}
